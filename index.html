<!DOCTYPE html>
<html>
    <head>
        <title>Eternity Pixel Dungeon</title>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background: #000;
                height: 100vh;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #canvas {
                border: none;
            }
        </style>
    <script>(function(){var g=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,o){var c=g.call(this,t,o);if(c&&(t==='webgl'||t==='experimental-webgl')&&c.getExtension){try{c.getExtension('OES_standard_derivatives');}catch(e){}}return c;};})();</script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eternity PD">
<meta name="application-name" content="Eternity PD">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons-pwa/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons-pwa/icon-192.png">
<style>
  html, body {
    position: fixed; inset: 0; margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden; background: #000;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  body { display: block !important; }
  body > div { position: static; }
  /* The canvas is placed by script (left/top/width/height px) inside the iOS safe area.
     It must stay position:fixed: gdx-teavm's touch math only adds the canvas' own offsetTop/Left. */
  #canvas {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block;
    border: none; outline: none; touch-action: none; background: #000;
  }
  #canvas.epd-crisp { image-rendering: pixelated; image-rendering: crisp-edges; }
  #epd-probe {
    position: fixed; left: 0; top: 0; width: 0; visibility: hidden; pointer-events: none;
    height: 100vh; height: 100lvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #epd-stick, #epd-stick-toggle {
    position: fixed; z-index: 10; display: none; box-sizing: border-box;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }
  #epd-stick {
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.05) 70%);
    border: 2px solid rgba(255,255,255,0.28);
  }
  #epd-stick::before {  /* 8 direction ticks */
    content: ""; position: absolute; inset: 14%; border-radius: 50%;
    border: 1px dashed rgba(255,255,255,0.14);
  }
  #epd-knob {
    position: absolute; left: 50%; top: 50%; width: 42%; height: 42%;
    margin: -21% 0 0 -21%; border-radius: 50%;
    background: rgba(255,255,255,0.30); border: 2px solid rgba(255,255,255,0.45);
    box-sizing: border-box; pointer-events: none;
  }
  #epd-stick.epd-active #epd-knob { background: rgba(255,230,140,0.45); }
  #epd-stick-toggle {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.35);
    color: rgba(255,255,255,0.75); font: 16px/28px sans-serif; text-align: center;
  }
</style>
<script>
/* ---- canvas placement: fill the iOS safe area exactly ----------------------------------------------
   WebLauncher uses width/height -1, so gdx-teavm never sizes the canvas; this script does, and the game
   picks the new backbuffer size up on its next frame. Backbuffer = CSS px (same UI scale as before),
   upscaled with nearest-neighbour on integer devicePixelRatio screens.
   iOS 26 Home Screen apps (black-translucent + viewport-fit=cover) report innerHeight/100dvh short by the
   status bar height while the page is drawn from the very top of the screen; 100lvh is the real height,
   so in standalone mode use the larger of the two (clamped to the screen).
   Test hook: ?epdInsets=top,right,bottom,left overrides env(safe-area-inset-*). */
(function () {
  var q = /[?&]epdInsets=([\d.,]+)/.exec(location.search);
  var forced = q ? q[1].split(',').map(Number) : null;
  function standalone() {
    return navigator.standalone === true ||
      (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches));
  }
  var probe;
  function measure() {
    if (!probe) {
      probe = document.createElement('div'); probe.id = 'epd-probe';
      (document.body || document.documentElement).appendChild(probe);
    }
    var cs = getComputedStyle(probe);
    var ins = forced || [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].map(parseFloat);
    var vw = window.innerWidth, vh = window.innerHeight;
    var de = document.documentElement;
    if (de && de.clientWidth > 0 && Math.abs(de.clientWidth - vw) < 2) vw = de.clientWidth;
    if (standalone()) {
      var lvh = parseFloat(cs.height) || 0;
      var landscape = vw > vh;
      var screenH = Math.min(screen.width, screen.height), screenL = Math.max(screen.width, screen.height);
      var maxH = landscape ? screenH : screenL;
      /* only when the page is drawn under the status bar (top inset > 0) or in landscape */
      if ((ins[0] > 0 || landscape) && lvh > vh) vh = Math.min(lvh, maxH || lvh);
    }
    return { vw: vw, vh: vh, t: ins[0] || 0, r: ins[1] || 0, b: ins[2] || 0, l: ins[3] || 0 };
  }
  var last = '';
  function layout() {
    var c = document.getElementById('canvas');
    if (!c) return;
    var m = measure();
    var L = Math.round(m.l), T = Math.round(m.t);
    var W = Math.max(1, Math.floor(m.vw - m.l - m.r)), H = Math.max(1, Math.floor(m.vh - m.t - m.b));
    var key = [L, T, W, H].join(',');
    if (key !== last) {
      last = key;
      c.style.left = L + 'px'; c.style.top = T + 'px';
      c.style.width = W + 'px'; c.style.height = H + 'px';
    }
    if (c.width !== W) c.width = W;
    if (c.height !== H) c.height = H;
    var crisp = Math.abs((window.devicePixelRatio || 1) - Math.round(window.devicePixelRatio || 1)) < 0.01;
    c.classList.toggle('epd-crisp', crisp);
    window.__epdFrame = { left: L, top: T, width: W, height: H, insets: [m.t, m.r, m.b, m.l], vw: m.vw, vh: m.vh,
                          innerW: window.innerWidth, innerH: window.innerHeight, standalone: !!standalone() };
    if (window.__epdStickLayout) window.__epdStickLayout();
  }
  window.__epdLayout = layout;
  function burst() {
    requestAnimationFrame(layout);
    [50, 150, 300, 600, 1000, 2000].forEach(function (t) { setTimeout(layout, t); });
  }
  document.addEventListener('DOMContentLoaded', layout);
  window.addEventListener('resize', burst);
  window.addEventListener('orientationchange', burst);
  window.addEventListener('pageshow', burst);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) burst(); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', burst);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', burst);
  if (window.matchMedia) { try { matchMedia('(orientation: portrait)').addEventListener('change', burst); } catch (e) {} }
  window.addEventListener('load', function () { burst(); setInterval(layout, 500); });
  /* no pinch/double-tap zoom or page bounce */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
})();

/* ---- 8-direction movement joystick ----------------------------------------------------------------
   Sends the numpad keys the game binds to movement (8 N, 9 NE, 6 E, 3 SE, 2 S, 1 SW, 4 W, 7 NW) as
   keydown/keyup on document, where gdx-teavm listens. Holding a direction keeps the key down, and the
   game repeats the step while it is held. Placement comes from window.__epdHud, published by the game
   (WebShatteredPixelDungeon): just above the toolbar, left of the right-hand tag column.
   Hidden on the title/menus, during the tutorial HUD fade, and while a window is open.
   The small round button next to it hides/shows the stick (remembered in localStorage). */
(function () {
  var KEYS = ['Numpad6', 'Numpad9', 'Numpad8', 'Numpad7', 'Numpad4', 'Numpad1', 'Numpad2', 'Numpad3'];
  var stick, knob, toggle, current = -1, pointerId = null, enabled = true;
  try { enabled = localStorage.getItem('epd.stick') !== 'off'; } catch (e) {}
  function key(type, code) {
    var ev = new KeyboardEvent(type, { code: code, key: code.slice(-1), bubbles: true, cancelable: true });
    document.dispatchEvent(ev);
  }
  function setDir(d) {
    if (d === current) return;
    if (current >= 0) key('keyup', KEYS[current]);
    current = d;
    if (current >= 0) key('keydown', KEYS[current]);
    stick.classList.toggle('epd-active', current >= 0);
  }
  function release() {
    setDir(-1); pointerId = null;
    knob.style.transform = '';
  }
  function track(e) {
    var r = stick.getBoundingClientRect();
    var R = r.width / 2, dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    var dist = Math.sqrt(dx * dx + dy * dy), lim = R * 0.55;
    var k = dist > lim ? lim / dist : 1;
    knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
    if (dist < R * 0.28) { setDir(-1); return; }          /* dead zone */
    var a = Math.atan2(-dy, dx);                            /* screen y grows downwards */
    setDir(((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8);
  }
  function stop(e) { e.preventDefault(); e.stopPropagation(); }
  function build() {
    stick = document.createElement('div'); stick.id = 'epd-stick';
    knob = document.createElement('div'); knob.id = 'epd-knob'; stick.appendChild(knob);
    toggle = document.createElement('div'); toggle.id = 'epd-stick-toggle'; toggle.textContent = '\u2725';
    document.body.appendChild(stick); document.body.appendChild(toggle);
    stick.addEventListener('pointerdown', function (e) {
      stop(e);
      if (pointerId !== null) return;
      pointerId = e.pointerId;
      try { stick.setPointerCapture(e.pointerId); } catch (x) {}
      track(e);
    }, { passive: false });
    stick.addEventListener('pointermove', function (e) { if (e.pointerId === pointerId) { stop(e); track(e); } }, { passive: false });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) {
      stick.addEventListener(t, function (e) { if (e.pointerId === pointerId) { stop(e); release(); } }, { passive: false });
    });
    toggle.addEventListener('pointerdown', function (e) {
      stop(e);
      enabled = !enabled;
      try { localStorage.setItem('epd.stick', enabled ? 'on' : 'off'); } catch (x) {}
      if (!enabled) release();
      place();
    }, { passive: false });
    [stick, toggle].forEach(function (el) {
      ['touchstart', 'touchmove', 'touchend', 'mousedown', 'mouseup', 'click', 'contextmenu'].forEach(function (t) {
        el.addEventListener(t, stop, { passive: false });
      });
    });
    window.addEventListener('blur', function () { if (pointerId !== null) release(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && stick) release(); });
  }
  var lastKey = '';
  function place() {
    if (!stick) return;
    var hud = window.__epdHud, f = window.__epdFrame, c = document.getElementById('canvas');
    var show = !!(hud && hud.inGame && hud.hud && !hud.wnd && f && c && c.width > 0);
    if (!show) {
      if (stick.style.display !== 'none') { release(); stick.style.display = 'none'; }
      toggle.style.display = 'none'; lastKey = ''; return;
    }
    var s = f.width / c.width;                 /* css px per backbuffer px */
    var u = hud.zoom * s;                      /* css px per ui unit */
    var bottomY = f.top + hud.bottom * u;      /* top edge of the toolbar (css px) */
    var rightX = f.left + f.width - hud.right * u;
    var size = Math.round(Math.max(96, Math.min(132, Math.min(f.width, f.height) * 0.34)));
    var x = Math.round(rightX - size - 8), y = Math.round(bottomY - size - 10);
    if (y < f.top + 60) y = Math.round(f.top + 60);
    var k = [x, y, size, enabled].join(',');
    if (k !== lastKey) {
      lastKey = k;
      stick.style.left = x + 'px'; stick.style.top = y + 'px';
      stick.style.width = size + 'px'; stick.style.height = size + 'px';
      toggle.style.left = (enabled ? x - 18 : rightX - 38) + 'px';
      toggle.style.top = (enabled ? y - 18 : bottomY - 40) + 'px';
      toggle.style.opacity = enabled ? '0.8' : '0.55';
    }
    stick.style.display = enabled ? 'block' : 'none';
    toggle.style.display = 'block';
    window.__epdStick = { x: x, y: y, size: size, enabled: enabled };
  }
  window.__epdStickLayout = place;
  window.addEventListener('DOMContentLoaded', function () {
    build();
    (function loop() { place(); setTimeout(loop, 150); })();
  });
})();

/* ---- saves: make IndexedDB writes land before iOS suspends a hidden page ---------------------------
   gdx-teavm writes every file with its own one-request readwrite transaction; commit() it right away
   instead of waiting for the task to end. __epdIdbPending counts transactions not yet complete. */
(function () {
  if (!window.IDBObjectStore) return;
  window.__epdIdbPending = 0;
  var P = IDBObjectStore.prototype;
  ['put', 'delete'].forEach(function (m) {
    var orig = P[m];
    P[m] = function () {
      var req = orig.apply(this, arguments);
      try {
        var tx = this.transaction;
        if (tx && tx.mode === 'readwrite' && !tx.__epd) {
          tx.__epd = true;
          window.__epdIdbPending++;
          var done = function () { window.__epdIdbPending = Math.max(0, window.__epdIdbPending - 1); };
          tx.addEventListener('complete', done); tx.addEventListener('abort', done); tx.addEventListener('error', done);
          if (typeof tx.commit === 'function') tx.commit();
        }
      } catch (e) {}
      return req;
    };
  });
})();

/* ---- offline support + prompt updates ---------------------------------------------------------------
   The new service worker activates immediately (skipWaiting + clients.claim). When it takes over a page
   that already had an older one, reload once - right away on the title screen, or (mid-run) the next time
   the app comes back to the foreground, after the hide-save. Updates are checked on launch and resume. */
if ('serviceWorker' in navigator) {
  (function () {
    var hadController = !!navigator.serviceWorker.controller, pending = false, reloaded = false;
    function reload() { if (reloaded) return; reloaded = true; location.reload(); }
    function inRun() { return !!(window.__epdHud && window.__epdHud.inGame); }
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; }
      pending = true;
      if (!inRun()) reload();
    });
    setInterval(function () { if (pending && !inRun()) reload(); }, 2000);
    var reg = null;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' })
        .then(function (r) { reg = r; })
        .catch(function (e) { console.warn('SW registration failed', e); });
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      if (pending) { reload(); return; }
      if (reg) reg.update().catch(function () {});
    });
  })();
}
if (navigator.storage && navigator.storage.persist) {
  window.addEventListener('load', function () {
    navigator.storage.persisted().then(function (p) { return p || navigator.storage.persist(); })
      .then(function (p) { window.__epdPersisted = p; }).catch(function () {});
  });
}
</script>
<!-- EPD-PWA:END -->
