   picks the new backbuffer size up on its next frame (Game.resize -> scene reset/relayout, like desktop).

     If iOS then also reports all safe-area insets as 0, the gap is used as the top inset (portrait) so
     the HUD is not drawn under the status bar / Dynamic Island.

/* ---- 8-direction movement joystick with deflection-proportional speed --------------------------------
   Steps are paced here, not by the game's key hold-repeat: each step is one keydown+keyup of the
   numpad key the game binds to that direction (8 N, 9 NE, 6 E, 3 SE, 2 S, 1 SW, 4 W, 7 NW), dispatched on
   document where gdx-teavm listens. Deflection t (0 at the dead-zone edge, 1 at the outer limit) sets the
   step rate on a quadratic curve: rate = 1/600ms + (1/100ms - 1/600ms) * t^2, i.e. ~600 ms between steps
   for a small push, ~270 ms at half, and no extra wait at full deflection (the next step goes as soon as the hero is ready =
   the normal hold-to-move rate). The game publishes window.__epdHero {pos, ready, frame} every frame;
   the key goes down when the next step is due (even while the previous step still runs, so the game takes
   it the moment the hero is ready - no lost steps) and comes up as soon as the hero's position changes,
   before the game's hold-repeat could start a second step. At full deflection the key simply stays down
   between steps (the game's own hold-to-move rate); it comes up as soon as the push drops below full.
   Like the game's own hold-to-move, pushing into something that doesn't move the hero (an enemy = one
   attack, a wall, a locked door) acts once and then waits until the direction changes or the stick is
   re-centred. Releasing stops at once (no further taps). Placement comes from window.__epdHud (published
   by the game ~6x/s): above the toolbar, left of the tag column; it is only trusted when it matches the
   current canvas size, so after a resize/rotation/fold the stick is re-placed from fresh HUD data.
   Hidden on the title/menus, during the tutorial HUD fade, and while a window is open.
   The small round button next to it hides/shows the stick (remembered in localStorage). */
(function () {
  var KEYS = ['Numpad6', 'Numpad9', 'Numpad8', 'Numpad7', 'Numpad4', 'Numpad1', 'Numpad2', 'Numpad3'];
  var SLOW = 600, FAST = 100;          /* ms between steps at the dead-zone edge / near full deflection; at full
                                          deflection there is no wait at all beyond the hero being ready */
  var DEAD = 0.22, FULL = 0.80;        /* fractions of the stick radius */
  var KNOB = 0.55;                     /* knob travel limit, fraction of the radius */
  var stick, knob, toggle, pointerId = null, enabled = true;
  var dir = -1, defl = 0, lastStepAt = 0, blocked = false, timer = null;
  var stats = window.__epdStickStats = { taps: 0, steps: [] };

  }
  function interval(t) {
    if (t >= 0.98) return 0;                                   /* full deflection: next step as soon as ready */
    var rMin = 1 / SLOW, rMax = 1 / FAST;
    return 1 / (rMin + (rMax - rMin) * t * t);
  }
  window.__epdStickInterval = interval;
  function hero() { return window.__epdHero; }
  var down = null;                      /* the key currently pressed for a step: {code, pos, frame, at} */
  function keyUp() { if (down) { key('keyup', down.code); down = null; } }
  function tick() {
    timer = null;
    if (dir < 0) { keyUp(); return; }
    var h = hero(), now = performance.now();

      if (!h || h.pos !== down.pos) {
        /* the step started: release at once so the game's hold-repeat never adds a second one -
           except at full deflection, where the hold-repeat rate is exactly the speed wanted */
        lastStepAt = now; stats.steps.push(now);

        else keyUp();
      } else if (h.ready && now - down.at > 250 && h.frame - down.frame >= 6) {
        keyUp(); blocked = true;            /* attacked / bumped a wall: act once, like hold-to-move */
      } else if (now - down.at > 3000) {

      var wait = interval(defl);

      lastKey = k;

      stick.style.width = size + 'px'; stick.style.height = size + 'px';

          tx.addEventListener('complete', done); tx.addEventListener('abort', done); tx.addEventListener('error', done);
